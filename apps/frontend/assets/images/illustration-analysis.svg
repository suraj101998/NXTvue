<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="illGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" rx="16" fill="#020617" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Chart background grid -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.5">
    <line x1="40" y1="40" x2="360" y2="40"/>
    <line x1="40" y1="90" x2="360" y2="90"/>
    <line x1="40" y1="140" x2="360" y2="140"/>
    <line x1="40" y1="190" x2="360" y2="190"/>
    <line x1="40" y1="240" x2="360" y2="240"/>
    <line x1="40" y1="40" x2="40" y2="260"/>
    <line x1="100" y1="40" x2="100" y2="260"/>
    <line x1="160" y1="40" x2="160" y2="260"/>
    <line x1="220" y1="40" x2="220" y2="260"/>
    <line x1="280" y1="40" x2="280" y2="260"/>
    <line x1="340" y1="40" x2="340" y2="260"/>
  </g>
  
  <!-- Price candlesticks -->
  <g stroke-width="2">
    <g stroke="#06B6D4">
      <line x1="70" y1="180" x2="70" y2="120"/>
      <rect x="66" y="130" width="8" height="50" fill="#06B6D4" opacity="0.3"/>
    </g>
    <g stroke="#EF4444">
      <line x1="105" y1="160" x2="105" y2="190"/>
      <rect x="101" y="165" width="8" height="25" fill="#EF4444" opacity="0.3"/>
    </g>
    <g stroke="#06B6D4">
      <line x1="140" y1="150" x2="140" y2="100"/>
      <rect x="136" y="110" width="8" height="40" fill="#06B6D4" opacity="0.3"/>
    </g>
    <g stroke="#06B6D4">
      <line x1="175" y1="140" x2="175" y2="80"/>
      <rect x="171" y="90" width="8" height="50" fill="#06B6D4" opacity="0.3"/>
    </g>
    <g stroke="#EF4444">
      <line x1="210" y1="170" x2="210" y2="200"/>
      <rect x="206" y="175" width="8" height="25" fill="#EF4444" opacity="0.3"/>
    </g>
    <g stroke="#06B6D4">
      <line x1="245" y1="130" x2="245" y2="70"/>
      <rect x="241" y="80" width="8" height="50" fill="#06B6D4" opacity="0.3"/>
    </g>
    <g stroke="#06B6D4">
      <line x1="280" y1="120" x2="280" y2="60"/>
      <rect x="276" y="70" width="8" height="50" fill="#06B6D4" opacity="0.3"/>
    </g>
    <g stroke="#06B6D4">
      <line x1="315" y1="110" x2="315" y2="50"/>
      <rect x="311" y="60" width="8" height="50" fill="#06B6D4" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Trend line -->
  <path d="M55 150 C90 130, 125 90, 160 85 C195 80, 230 75, 265 65 C300 55, 335 50, 355 45" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" 
        stroke-dasharray="5 3" opacity="0.8"/>
  
  <!-- Moving average lines -->
  <path d="M55 170 C90 155, 125 130, 160 128 C195 126, 230 122, 265 118 C300 114, 335 110, 355 108" 
        fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" 
        stroke-dasharray="8 4" opacity="0.5"/>
  
  <!-- Analysis indicators -->
  <circle cx="160" cy="85" r="8" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#06B6D4" font-family="monospace">⬆</text>
  
  <circle cx="265" cy="65" r="8" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
  <text x="265" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#3B82F6" font-family="monospace">★</text>
  
  <!-- Side panel - metrics -->
  <rect x="320" y="40" width="70" height="220" rx="8" fill="#020617" stroke="#1E293B" stroke-width="1"/>
  <text x="355" y="65" text-anchor="middle" font-size="9" font-weight="600" fill="#64748B" font-family="system-ui">METRICS</text>
  
  <g font-family="system-ui" font-size="11" fill="#E2E8F0">
    <text x="335" y="95">P/E: 24.5x</text>
    <text x="335" y="115">ROCE: 18.2%</text>
    <text x="335" y="135">Sharpe: 1.34</text>
    <text x="335" y="155">Max DD: -12%</text>
    <text x="335" y="175">VaR 95: -2.1%</text>
    <text x="335" y="195">Beta: 1.12</text>
    <text x="335" y="215">Alpha: +3.4%</text>
  </g>
</svg>