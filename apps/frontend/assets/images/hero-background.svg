<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="gridColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.01"/>
    </linearGradient>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <ellipse cx="960" cy="540" rx="800" ry="400" fill="url(#centerGlow)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="url(#gridColor)" stroke-width="0.5">
    <line x1="0" y1="0" x2="1920" y2="0"/>
    <line x1="0" y1="60" x2="1920" y2="60"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="420" x2="1920" y2="420"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="660" x2="1920" y2="660"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="780" x2="1920" y2="780"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="0" y1="1020" x2="1920" y2="1020"/>
    
    <line x1="0" y1="0" x2="0" y2="1080"/>
    <line x1="80" y1="0" x2="80" y2="1080"/>
    <line x1="160" y1="0" x2="160" y2="1080"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="560" y1="0" x2="560" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="880" y1="0" x2="880" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1040" y1="0" x2="1040" y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1360" y1="0" x2="1360" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1520" y1="0" x2="1520" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
    <line x1="1840" y1="0" x2="1840" y2="1080"/>
    <line x1="1920" y1="0" x2="1920" y2="1080"/>
  </g>
  
  <!-- Floating data particles -->
  <g fill="url(#gridColor)">
    <circle cx="200" cy="150" r="2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="300" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="200" r="2.5" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="400" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="180" r="2" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1200" cy="350" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="220" r="2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1600" cy="400" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1700" cy="150" r="2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="600" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="700" r="2" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="800" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="650" r="2.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="750" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.3;0.08;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="600" r="2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="800" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1700" cy="650" r="2" opacity="0.4"><animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Central trend visualization -->
  <g transform="translate(960, 540)">
    <!-- Outer pulse rings -->
    <circle r="120" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.15">
      <animate attributeName="r" values="80;140;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.02;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="100" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.1">
      <animate attributeName="r" values="60;120;60" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.01;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Main trend line -->
    <path d="M-150 50 C-80 20, -20 -10, 0 -20 C20 -30, 80 -40, 150 -30" 
          fill="none" stroke="url(#gridColor)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Key data points on trend -->
    <circle cx="-100" cy="30" r="5" fill="#06B6D4" opacity="0.8">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-20" r="7" fill="#3B82F6" opacity="0.9">
      <animate attributeName="r" values="7;10;7" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="-30" r="5" fill="#06B6D4" opacity="0.8">
      <animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Core vantage point -->
    <circle r="12" fill="#020617" stroke="#06B6D4" stroke-width="2" opacity="0.9"/>
    <circle r="6" fill="url(#gridColor)">
      <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#06B6D4">
      <animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>