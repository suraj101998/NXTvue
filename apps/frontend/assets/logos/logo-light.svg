<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gradientPrimaryLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="50%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#DBEAFE"/>
    </linearGradient>
    <linearGradient id="gradientAccentLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="glowLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="60" cy="60" r="56" fill="url(#gradientPrimaryLight)"/>
  <circle cx="60" cy="60" r="56" stroke="url(#gradientAccentLight)" stroke-width="1.5" fill="none"/>
  
  <path d="M60 12 
           A48 48 0 0 1 108 60 
           A48 48 0 0 1 60 108 
           A48 48 0 0 1 12 60 
           A48 48 0 0 1 60 12" 
        fill="none" stroke="url(#gradientAccentLight)" stroke-width="2.5" stroke-linecap="round" 
        stroke-dasharray="12 8" opacity="0.5"/>
  
  <path d="M30 75 
           C40 65, 50 55, 60 50 
           C70 45, 80 40, 90 35" 
        fill="none" stroke="url(#gradientAccentLight)" stroke-width="3" stroke-linecap="round" 
        stroke-linejoin="round" filter="url(#glowLight)"/>
  
  <circle cx="40" cy="62" r="3.5" fill="#06B6D4" filter="url(#glowLight)"/>
  <circle cx="60" cy="50" r="4.5" fill="#3B82F6" filter="url(#glowLight)"/>
  <circle cx="80" cy="42" r="3.5" fill="#06B6D4" filter="url(#glowLight)"/>
  
  <circle cx="60" cy="60" r="6" fill="#FFFFFF" stroke="url(#gradientAccentLight)" stroke-width="2"/>
  <circle cx="60" cy="60" r="2.5" fill="url(#gradientAccentLight)"/>
  
  <g stroke="#3B82F6" stroke-width="0.5" opacity="0.1">
    <line x1="24" y1="84" x2="96" y2="84"/>
    <line x1="24" y1="72" x2="96" y2="72"/>
    <line x1="24" y1="60" x2="96" y2="60"/>
    <line x1="24" y1="48" x2="96" y2="48"/>
    <line x1="36" y1="24" x2="36" y2="96"/>
    <line x1="60" y1="24" x2="60" y2="96"/>
    <line x1="84" y1="24" x2="84" y2="96"/>
  </g>
</svg>