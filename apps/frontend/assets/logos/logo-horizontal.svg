<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="gradientText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Symbol (left) -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="url(#gradientAccent)" opacity="0.15"/>
    <circle cx="30" cy="30" r="28" stroke="url(#gradientAccent)" stroke-width="1.5" fill="none"/>
    
    <path d="M30 6 
             A24 24 0 0 1 54 30 
             A24 24 0 0 1 30 54 
             A24 24 0 0 1 6 30 
             A24 24 0 0 1 30 6" 
          fill="none" stroke="url(#gradientAccent)" stroke-width="1.5" stroke-linecap="round" 
          stroke-dasharray="6 4" opacity="0.6"/>
    
    <path d="M15 42 
             C20 38, 25 34, 30 32 
             C35 30, 40 28, 45 26" 
          fill="none" stroke="url(#gradientAccent)" stroke-width="2" stroke-linecap="round" 
          stroke-linejoin="round" filter="url(#glow)"/>
    
    <circle cx="20" cy="37" r="2" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="30" cy="32" r="2.5" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="40" cy="27" r="2" fill="#06B6D4" filter="url(#glow)"/>
    
    <circle cx="30" cy="30" r="3.5" fill="#0F172A" stroke="url(#gradientAccent)" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="1.2" fill="url(#gradientAccent)"/>
  </g>
  
  <!-- Wordmark -->
  <text x="70" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="32" font-weight="700" letter-spacing="-0.5px" fill="url(#gradientText)">
    VANTAGE
  </text>
  <text x="70" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" font-weight="500" letter-spacing="2px" fill="#64748B">
    INVESTMENT INTELLIGENCE
  </text>
</svg>